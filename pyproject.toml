[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "uit-last-dance-aizalo26"
version = "0.1.0"
description = "Zalo AI Challenge 2026 - Track 2 DataMate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0.0",
    "sqlglot>=25.0.0",
    "pydantic>=2.0.0",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=15.0.0",
    "huggingface-hub>=0.34,<2",
    "openai>=1.0.0",
    "modal>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
download = ["huggingface-hub>=0.34,<2"]
inference = [
    "torch>=2.4.0",
    "vllm>=0.17,<1",
    "openai>=1.0.0",
]
gpu = [
    "torch>=2.4.0",
    "vllm>=0.17,<1",
]
modal = ["modal>=1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/datamate"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
