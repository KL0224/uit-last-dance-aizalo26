# Đường dẫn tương đối được tính từ file TOML này, không từ thư mục chạy lệnh.
[model]
model_path = "../models/Qwen3.5-9B"
dtype = "bfloat16"
max_model_len = 32768
# Cấu hình tối ưu cho Single GPU A100 40GB chạy song song 2 model vLLM:
# Model 3B (Grounding): 0.22 (~8.8 GB VRAM)
# Model 9B (Planner):   0.68 (~27.2 GB VRAM)
# Tổng VRAM vLLM: 0.90 (36.0 GB / 40.0 GB), chừa 4.0 GB an toàn tránh OOM.
gpu_memory_utilization = 0.68
tensor_parallel_size = 1
max_num_seqs = 16
trust_remote_code = false
# Bỏ vision encoder và multimodal profiling để dành bộ nhớ cho text/KV cache.
language_model_only = true

# Đây là tùy chọn template Qwen; bỏ/đổi khi dùng họ model khác.
[model.chat_template_kwargs]
enable_thinking = true

[generation]
max_new_tokens = 8192
# Ép đóng thinking để dành phần output còn lại cho JSON/SQL cuối.
thinking_token_budget = 4096
temperature = 0.0
top_p = 1.0
top_k = -1
repetition_penalty = 1.05
presence_penalty = 0.0
stop = []

[voting]
enabled = true
rounds = 2
initial_candidates = 4
threshold = 0.5
temperature = 0.7
top_p = 0.8
top_k = 20
thinking_mode = "two_round"
