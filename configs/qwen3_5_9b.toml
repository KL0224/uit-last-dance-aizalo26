# Đường dẫn tương đối được tính từ file TOML này, không từ thư mục chạy lệnh.
[model]
model_path = "../.models/Qwen3.5-9B"
dtype = "bfloat16"
max_model_len = 32768
gpu_memory_utilization = 0.9
tensor_parallel_size = 1
max_num_seqs = 16
trust_remote_code = false

# Đây là tùy chọn template Qwen; bỏ/đổi khi dùng họ model khác.
[model.chat_template_kwargs]
enable_thinking = true

[generation]
max_new_tokens = 8192
# Ép đóng thinking để dành phần output còn lại cho JSON/SQL cuối.
thinking_token_budget = 4096
temperature = 0.0
top_p = 1.0
top_k = -1
repetition_penalty = 1.05
presence_penalty = 0.0
stop = []
