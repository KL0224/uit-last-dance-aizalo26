# Qwen 2.5 3B: verbatim mentions + detailed temporal extraction (contract v3).
[model]
model_path = "../.models/Qwen2.5-3B-Instruct"
dtype = "bfloat16"
max_model_len = 8192
# Cấu hình tối ưu cho Single GPU A100 40GB chạy song song 2 model vLLM:
# Model 3B (Grounding): 0.22 (~8.8 GB VRAM)
# Model 9B (Planner):   0.68 (~27.2 GB VRAM)
# Tổng VRAM vLLM: 0.90 (36.0 GB / 40.0 GB), chừa 4.0 GB an toàn tránh OOM.
gpu_memory_utilization = 0.22
tensor_parallel_size = 1
max_num_seqs = 8
trust_remote_code = false

[generation]
# Smoke run showed incomplete JSON at 768; keep 5632 input + 2048 output < 8192.
max_new_tokens = 2048
temperature = 0.0
top_p = 1.0
top_k = -1
repetition_penalty = 1.0
presence_penalty = 0.0
stop = []
